<!doctype html><html lang="mn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'self'"><title>Өрөө · Админы бүртгэл идэвхжүүлэх</title><link rel="stylesheet" href="activate.css"></head><body><main><img class="logo" src="assets/oroo.png" alt="Өрөө"><span class="eyebrow">ӨРӨӨ ADMIN</span><h1>Админы бүртгэлээ идэвхжүүлнэ үү</h1><p>Нууц үгээ өөрөө тохируулна уу. Идэвхжүүлэх холбоос нэг удаа ашиглагдана.</p><form id="activation-form"><label for="password">Шинэ нууц үг</label><input id="password" name="password" type="password" minlength="15" maxlength="128" required autocomplete="new-password"><label for="confirm">Нууц үгээ давтан оруулна уу</label><input id="confirm" name="confirm" type="password" minlength="15" maxlength="128" required autocomplete="new-password"><p class="hint">15-аас дээш тэмдэгттэй, бусад сайтад ашиглаагүй нууц үг сонгоно уу.</p><p id="activation-status" role="status"></p><button type="submit">Бүртгэл идэвхжүүлэх</button></form></main><script src="activate.js"></script></body></html>
